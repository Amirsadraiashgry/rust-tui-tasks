[package]
name = "rust-tui-tasks"
version = "0.1.0"
edition = "2021"
description = "A keyboard-driven terminal task manager written in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Amirsadraiashgry/rust-tui-tasks"
keywords = ["tui", "terminal", "todo", "tasks", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
unicode-width = "0.2"
